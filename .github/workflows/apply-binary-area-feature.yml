name: Apply binary image viewer Japanese labels

# Temporary importer for the feature/binary-image-viewer-ja branch.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-binary-area-feature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/binary-image-viewer-ja
          fetch-depth: 0

      - name: Apply verified source updates
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=.feature-patches/apply_binary_viewer_ja.py
          test -f "$SCRIPT"
          python3 "$SCRIPT"
          rm -rf .feature-patches

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          if command -v php >/dev/null 2>&1; then
            php -l api.php
            php -l index.php
          fi
          grep -Fq '二値化白領域（空洞）面積 mm²' assets/app.js
          grep -Fq '二値化黒領域（生地）面積 mm²' assets/app.js
          grep -Fq '二値化白領域率 %' index.php
          grep -Fq '二値化黒領域率 %' api.php
          grep -Fq 'savedBinaryFigure' index.php
          grep -Fq 'binary_area_image_path' api.php
          grep -Fq 'binary-image-viewer' assets/app.js

      - name: Commit feature implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve Japanese binary metrics and image viewer'
          git push origin HEAD:feature/binary-image-viewer-ja
