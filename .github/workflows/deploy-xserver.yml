name: Deploy to Xserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-xserver
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and test SSH connection
        shell: bash
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
        run: |
          set -euo pipefail
          test -n "${XSERVER_SSH_KEY:-}" || { echo "::error::XSERVER_SSH_KEY is empty."; exit 10; }
          test -n "${XSERVER_HOST:-}" || { echo "::error::XSERVER_HOST is empty."; exit 11; }
          test -n "${XSERVER_USER:-}" || { echo "::error::XSERVER_USER is empty."; exit 12; }
          PORT="${XSERVER_PORT:-10022}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$XSERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          success=0
          for attempt in 1 2 3; do
            echo "SSH attempt ${attempt}/3"
            if ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=20 -o ConnectionAttempts=1 "${XSERVER_USER}@${XSERVER_HOST}" 'echo "SSH connection OK"; echo "HOME=$HOME"'; then
              success=1
              break
            fi
            sleep 5
          done
          test "$success" -eq 1 || { echo "::error::Could not establish SSH connection after 3 attempts."; exit 13; }

      - name: Validate deployment path and production prerequisites
        shell: bash
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
          XSERVER_PATH: ${{ secrets.XSERVER_PATH }}
        run: |
          set -euo pipefail
          PORT="${XSERVER_PORT:-10022}"
          TARGET="${XSERVER_PATH%/}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "/" ]; then
            echo "::error::XSERVER_PATH is empty or '/'. Deployment to the server root is blocked for safety."
            exit 2
          fi
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${XSERVER_USER}@${XSERVER_HOST}" \
            "set -eu; \
             test -d '$TARGET' || { echo 'XSERVER_PATH does not exist'; exit 3; }; \
             test -w '$TARGET' || { echo 'XSERVER_PATH is not writable'; exit 4; }; \
             test -f '$TARGET/config.php' || { echo 'config.php is missing'; exit 5; }; \
             grep -Fq '10.6.0' '$TARGET/config.php' || { echo 'config.php app_version is not 10.6.0'; exit 6; }; \
             mkdir -p '$TARGET/uploads/intermediate'; \
             test -w '$TARGET/uploads/intermediate' || { echo 'uploads/intermediate is not writable'; exit 7; }; \
             echo 'Production prerequisites OK for 10.6.0'"

      - name: Deploy application files
        shell: bash
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
          XSERVER_PATH: ${{ secrets.XSERVER_PATH }}
        run: |
          set -euo pipefail
          PORT="${XSERVER_PORT:-10022}"
          TARGET="${XSERVER_PATH%/}"
          rsync -azv \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='config.php' \
            --exclude='uploads/' \
            --exclude='logs/' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "${XSERVER_USER}@${XSERVER_HOST}:${TARGET}/"

      - name: Verify deployed version
        shell: bash
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
          XSERVER_PATH: ${{ secrets.XSERVER_PATH }}
        run: |
          set -euo pipefail
          PORT="${XSERVER_PORT:-10022}"
          TARGET="${XSERVER_PATH%/}"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${XSERVER_USER}@${XSERVER_HOST}" \
            "set -eu; \
             cd '$TARGET'; \
             test -f index.php; \
             test -f api.php; \
             test -f python/analyze.py; \
             test -f migration_v10_5_5_to_v10_6.sql; \
             grep -Fq 'Version 10.6.0' README.md; \
             grep -Fq '10.6.0' config.php; \
             grep -Fq '10.6.0-python' python/analyze.py; \
             grep -Fq 'binary_white_area_mm2' api.php; \
             echo 'Deploy verification OK: BreadResearch 10.6.0'"
