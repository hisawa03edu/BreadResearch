name: Apply data list thumbnails

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-data-list-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/data-list-thumbnails
          fetch-depth: 0

      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=.feature-patches/apply_data_list_thumbnails.py
          test -f "$SCRIPT"
          python3 "$SCRIPT"
          rm -rf .feature-patches

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          if command -v php >/dev/null 2>&1; then
            php -l api.php
            php -l index.php
          fi
          grep -Fq 'dataThumbnailToggle' assets/app.js
          grep -Fq 'sampleThumbnailCell' assets/app.js
          grep -Fq 'latest_corrected_result_path' api.php
          grep -Fq 'サムネイルを表示（元画像・解析結果）' index.php
          grep -Fq '.sample-thumbnail{' assets/style.css
          grep -Fq 'assets/app.js?v=10.6.0-view4' index.php

      - name: Commit feature implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add optional original and result thumbnails to data list'
          git push origin HEAD:feature/data-list-thumbnails
